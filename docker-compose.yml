name: planner-mcp

services:
  browser-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.browser-worker
    image: planner-browser-worker:0.1.0
    environment:
      PLANNER_MODE: ${PLANNER_MODE:-mock}
      PLANNER_WORKER_HOST: 0.0.0.0
      PLANNER_WORKER_PORT: "8090"
    networks: [browser-internal, m365-egress]
    # No published ports: the worker is reachable only from the control plane.
    # Outbound traffic is additionally constrained by the browser egress allowlist.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # SEC-109: bound the blast radius of a wedged or hostile Chromium.
    mem_limit: 2g
    pids_limit: 512
    read_only: false          # Chromium requires a writable profile directory
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /dev/shm:rw,nosuid,size=256m
    volumes:
      - browser-profile:/var/lib/planner-worker/profile
    restart: unless-stopped

  control-plane:
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    image: planner-mcp:0.1.0
    depends_on:
      browser-worker:
        condition: service_healthy
    environment:
      PLANNER_MODE: ${PLANNER_MODE:-mock}
      PLANNER_MCP_HOST: 0.0.0.0
      PLANNER_MCP_PORT: "8080"
      PLANNER_WORKER_URL: http://browser-worker:8090
      PLANNER_STATE_PATH: /var/lib/planner-mcp/state.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    networks: [browser-internal, edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # SEC-109: bound the blast radius of the async control-plane service.
    mem_limit: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - mcp-state:/var/lib/planner-mcp
    restart: unless-stopped

networks:
  # Private control-plane/worker path. This network has no Internet route.
  browser-internal:
    internal: true
  # Dedicated worker-only outbound network. No host port is published and the
  # Playwright request policy fails closed outside the reviewed M365 allowlist.
  m365-egress: {}
  edge: {}

volumes:
  browser-profile: {}
  mcp-state: {}
