[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planner-mcp"
version = "0.1.0"
description = "MCP control plane for Microsoft Planner Premium via a private Playwright/Chromium browser worker"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "pestoura" }]
dependencies = [
  "fastmcp>=2.3.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.7.0,<3",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
worker = ["playwright>=1.47.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
planner-mcp = "planner_mcp.__main__:main"
planner-browser-worker = "planner_browser_worker.__main__:main"
planner-mcp-healthcheck = "planner_mcp.healthcheck:main"

[tool.hatch.build.targets.wheel]
packages = ["src/planner_mcp", "src/planner_browser_worker"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "planner_mcp/_contracts"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "W"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["planner_mcp", "planner_browser_worker"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
