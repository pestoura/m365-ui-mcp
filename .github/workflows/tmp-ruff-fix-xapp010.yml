name: Temporary Ruff Fix XAPP-010

on:
  push:
    branches:
      - wave-v/xapp-010-dead-letter-manual-intervention
    paths:
      - tests/test_xapp_dead_letter.py
      - .github/workflows/tmp-ruff-fix-xapp010.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave-v/xapp-010-dead-letter-manual-intervention
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Ruff canonical fix
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.2'
          ruff check tests/test_xapp_dead_letter.py --fix
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_xapp_dead_letter.py
          test "$(git diff --cached --name-only)" = "tests/test_xapp_dead_letter.py"
          git commit -m "fix(xapp): apply Ruff canonical import layout [ruff-applied]"
          git push
