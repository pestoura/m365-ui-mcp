name: TEMP REL-026 integrating controller

on:
  push:
    branches:
      - control/rel-026-integrating

permissions:
  contents: write

jobs:
  controller:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded REL-026 transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/m365-transition/execution-index.json')
          text = path.read_text(encoding='utf-8')
          start_marker = '    {\n      "key": "REL-026"'
          end_marker = '    {\n      "key": "REL-027"'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          required = [
              '"state": "IN_PROGRESS"',
              '"branch": "engineering/rel-026-delivery-economics"',
              '"prs": [399]',
              '"main:eba5f52ff826aa8ca1dfc4252a3a85fe21b550b5"',
          ]
          for token in required:
              if token not in block:
                  raise SystemExit(f'REL026_CONTROLLER_PRECONDITION_FAILED: {token}')

          block = block.replace('"state": "IN_PROGRESS"', '"state": "INTEGRATING"', 1)
          block = block.replace(
              '"branch": "engineering/rel-026-delivery-economics"',
              '"branch": "integration/rel-026-delivery-economics-closeout"',
              1,
          )
          block = block.replace('"prs": [399]', '"prs": [399, 584]', 1)
          old_tail = '        "main:eba5f52ff826aa8ca1dfc4252a3a85fe21b550b5"\n'
          new_tail = '''        "main:eba5f52ff826aa8ca1dfc4252a3a85fe21b550b5",\n        "pr:584",\n        "docs/m365-transition/evidence/rel-026-before-after.md",\n        "docs/m365-transition/evidence/rel-026-before-after.json",\n        "gha:31472246099/ci",\n        "gha:31472246100/jds-effective-plan",\n        "gha:31472246141/canonical-docs",\n        "gha:31472246107/release-governance",\n        "main:cf0fc4081f3a5da54bf19013fee9041893799fbe"\n'''
          if old_tail not in block:
              raise SystemExit('REL026_CONTROLLER_PRECONDITION_FAILED: baseline evidence tail')
          block = block.replace(old_tail, new_tail, 1)
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY

      - name: Ensure only canonical index changes survive
        shell: bash
        run: |
          git rm .github/workflows/rel-026-integrating-once.yml
          git add docs/m365-transition/execution-index.json
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/rel-026-integrating-once.yml\ndocs/m365-transition/execution-index.json'

      - name: Commit controller result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'control(rel): REL-026 IN_PROGRESS to INTEGRATING'
          git push origin HEAD:control/rel-026-integrating
