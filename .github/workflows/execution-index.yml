name: M365 Execution Index

on:
  pull_request:
    branches:
      - main
      - "integration/**"
    paths:
      - "docs/m365-transition/execution-index.json"
      - "scripts/check_execution_index.py"
      - ".github/workflows/execution-index.yml"
  push:
    branches:
      - main
      - control/stage-hardening-rel-001-005
    paths:
      - "docs/m365-transition/execution-index.json"
      - "scripts/check_execution_index.py"
      - ".github/workflows/execution-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: bounded WIP / canonical key / state transition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve previous index when available
        id: previous
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          previous="${RUNNER_TEMP}/execution-index.previous.json"
          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ "$HEAD_REF" == "$DEFAULT_BRANCH" ]] && [[ "$BASE_REF" == integration/* ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          elif [[ -n "${BASE_SHA}" ]] && git show "${BASE_SHA}:docs/m365-transition/execution-index.json" > "$previous" 2>/dev/null; then
            echo "path=$previous" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate execution index
        shell: bash
        env:
          PREVIOUS_INDEX: ${{ steps.previous.outputs.path }}
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_INDEX" ]]; then
            python scripts/check_execution_index.py --previous "$PREVIOUS_INDEX"
          else
            python scripts/check_execution_index.py
          fi

  temporary-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage hardening REL-001..005
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -Fq '[controller-applied]'; then
            exit 0
          fi
          git show HEAD^:docs/m365-transition/execution-index.json > /tmp/execution-index.previous.json
          python scripts/tmp_stage_rel_001_005.py
          python scripts/check_execution_index.py --previous /tmp/execution-index.previous.json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/m365-transition/execution-index.json
          test "$(git diff --cached --name-only)" = "docs/m365-transition/execution-index.json"
          git commit -m "control: stage hardening REL-001..005 [controller-applied]"
          git push
