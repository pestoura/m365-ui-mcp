name: TEMP REL-026 accepted controller

on:
  push:
    branches:
      - control/rel-026-accepted

permissions:
  contents: write

jobs:
  controller:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded REL-026 transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/m365-transition/execution-index.json')
          text = path.read_text(encoding='utf-8')
          start_marker = '    {\n      "key": "REL-026"'
          end_marker = '    {\n      "key": "REL-027"'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          required = [
              '"state": "INTEGRATING"',
              '"branch": "integration/rel-026-delivery-economics-closeout"',
              '"prs": [399, 584]',
              '"pr:584"',
              '"main:cf0fc4081f3a5da54bf19013fee9041893799fbe"',
          ]
          for token in required:
              if token not in block:
                  raise SystemExit(f'REL026_CONTROLLER_PRECONDITION_FAILED: {token}')

          block = block.replace('"state": "INTEGRATING"', '"state": "ACCEPTED"', 1)
          block = block.replace('"prs": [399, 584]', '"prs": [399, 584, 585]', 1)
          old_tail = '        "main:cf0fc4081f3a5da54bf19013fee9041893799fbe"\n'
          new_tail = '''        "main:cf0fc4081f3a5da54bf19013fee9041893799fbe",\n        "pr:585",\n        "gha:31473900548/ci",\n        "gha:31473900544/jds-effective-plan",\n        "gha:31473900563/canonical-docs",\n        "gha:31473900542/release-governance",\n        "gha:31473900545/execution-index",\n        "main:1676b6ff38b17715ab70f644eb4ae08d43e2d6f2"\n'''
          if old_tail not in block:
              raise SystemExit('REL026_CONTROLLER_PRECONDITION_FAILED: integrating evidence tail')
          block = block.replace(old_tail, new_tail, 1)
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY

      - name: Ensure only canonical index changes survive
        shell: bash
        run: |
          git rm .github/workflows/rel-026-accepted-once.yml
          git add docs/m365-transition/execution-index.json
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/rel-026-accepted-once.yml\ndocs/m365-transition/execution-index.json'

      - name: Commit controller result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'control(rel): REL-026 INTEGRATING to ACCEPTED'
          git push origin HEAD:control/rel-026-accepted
