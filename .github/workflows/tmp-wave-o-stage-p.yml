name: Temporary Wave O to P controller transition

on:
  push:
    branches:
      - control/wave-o-integrating-stage-wave-p

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stop after controller commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -Fq '[controller-applied]'; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply minimal controller transition
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:docs/m365-transition/execution-index.json > /tmp/execution-index.previous.json
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/m365-transition/execution-index.json')
          text = path.read_text(encoding='utf-8')

          evidence = '''"evidence": [
                "pr:483",
                "gha:31343439935/jds-effective-plan",
                "main:030ea78bd3febc6ed8c1195fd2700cf8b1d69ad6"
              ]'''
          lane_prs = {
              'OUT-110': 477,
              'OUT-111': 478,
              'OUT-112': 479,
              'OUT-113': 480,
              'OUT-114': 481,
              'OUT-115': 482,
          }

          def replace_once(block: str, old: str, new: str, key: str) -> str:
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f'{key}: expected exactly one {old!r}, found {count}')
              return block.replace(old, new, 1)

          for key, pr in lane_prs.items():
              marker = f'    {{\n      "key": "{key}",'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{key}: controller item not found')
              end = text.find('\n    },', start)
              if end < 0:
                  raise SystemExit(f'{key}: controller item terminator not found')
              end += len('\n    },')
              block = text[start:end]
              block = replace_once(block, '"state": "IN_PROGRESS"', '"state": "INTEGRATING"', key)
              block = replace_once(block, '"prs": []', f'"prs": [{pr}]', key)
              block = replace_once(block, '"evidence": []', evidence, key)
              block = replace_once(
                  block,
                  '"implementationState": "SPECIFIED_ONLY"',
                  '"implementationState": "IMPLEMENTED_MOCK_ONLY"',
                  key,
              )
              if '"liveSupportState": "UNOBSERVED"' not in block:
                  raise SystemExit(f'{key}: live support invariant changed unexpectedly')
              text = text[:start] + block + text[end:]

          for key in ('OUT-116', 'OUT-117', 'OUT-118', 'OUT-119', 'OUT-120'):
              if f'"key": "{key}"' in text:
                  raise SystemExit(f'{key}: already exists; refusing duplicate staging')

          new_items = '''    {
              "key": "OUT-116",
              "releaseBand": "0.7.x-people-todo-shared",
              "phase": "12-people-todo-shared",
              "dependencies": ["OUT-115"],
              "state": "READY",
              "riskClass": "OUTBOUND_GOVERNED",
              "wave": "wave-p-out-116-120",
              "branch": "wave-p/out-116-shared-mailbox-send-as",
              "issue": null,
              "prs": [],
              "evidence": [],
              "implementationState": "SPECIFIED_ONLY",
              "liveSupportState": "UNOBSERVED",
              "blockerCode": null
            },
            {
              "key": "OUT-117",
              "releaseBand": "0.7.x-people-todo-shared",
              "phase": "12-people-todo-shared",
              "dependencies": ["OUT-116"],
              "state": "READY",
              "riskClass": "OUTBOUND_GOVERNED",
              "wave": "wave-p-out-116-120",
              "branch": "wave-p/out-117-shared-mailbox-send-on-behalf",
              "issue": null,
              "prs": [],
              "evidence": [],
              "implementationState": "SPECIFIED_ONLY",
              "liveSupportState": "UNOBSERVED",
              "blockerCode": null
            },
            {
              "key": "OUT-118",
              "releaseBand": "0.7.x-people-todo-shared",
              "phase": "12-people-todo-shared",
              "dependencies": ["OUT-117"],
              "state": "READY",
              "riskClass": "READ",
              "wave": "wave-p-out-116-120",
              "branch": "wave-p/out-118-shared-calendar-linkage",
              "issue": null,
              "prs": [],
              "evidence": [],
              "implementationState": "SPECIFIED_ONLY",
              "liveSupportState": "UNOBSERVED",
              "blockerCode": null
            },
            {
              "key": "OUT-119",
              "releaseBand": "0.7.x-people-todo-shared",
              "phase": "12-people-todo-shared",
              "dependencies": ["OUT-118"],
              "state": "READY",
              "riskClass": "READ",
              "wave": "wave-p-out-116-120",
              "branch": "wave-p/out-119-capability-difference-reporting",
              "issue": null,
              "prs": [],
              "evidence": [],
              "implementationState": "SPECIFIED_ONLY",
              "liveSupportState": "UNOBSERVED",
              "blockerCode": null
            },
            {
              "key": "OUT-120",
              "releaseBand": "0.7.x-people-todo-shared",
              "phase": "13-security-compliance-visible",
              "dependencies": ["OUT-119"],
              "state": "READY",
              "riskClass": "OUTBOUND_GOVERNED",
              "wave": "wave-p-out-116-120",
              "branch": "wave-p/out-120-junk-not-junk-reporting",
              "issue": null,
              "prs": [],
              "evidence": [],
              "implementationState": "SPECIFIED_ONLY",
              "liveSupportState": "UNOBSERVED",
              "blockerCode": null
            },
'''
          anchor = '    {\n      "key": "REL-026",'
          if text.count(anchor) != 1:
              raise SystemExit('REL-026 anchor must occur exactly once')
          text = text.replace(anchor, new_items + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python scripts/check_execution_index.py --previous /tmp/execution-index.previous.json
          git diff --check
          git diff -- docs/m365-transition/execution-index.json

      - name: Commit controller only
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/m365-transition/execution-index.json
          test "$(git diff --cached --name-only)" = "docs/m365-transition/execution-index.json"
          git commit -m "control: stage Wave P [controller-applied]"
          git push
