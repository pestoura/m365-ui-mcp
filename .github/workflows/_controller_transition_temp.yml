name: Temporary controller Wave N/O transition

on:
  push:
    branches:
      - control/wave-n-integrating-stage-wave-o

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped fail-closed transition
        shell: bash
        run: |
          cp docs/m365-transition/execution-index.json /tmp/execution-index.previous.json
          python - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path

          path = Path('docs/m365-transition/execution-index.json')
          text = path.read_text(encoding='utf-8')

          def object_span(key: str) -> tuple[int, int, str]:
              pattern = re.compile(
                  rf'    \{{\n      "key": "{re.escape(key)}",.*?(?=\n    \}},\n    \{{\n      "key":)',
                  re.DOTALL,
              )
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f'object not found: {key}')
              return match.start(), match.end(), match.group(0)

          def replace_field(key: str, field: str, old: str, new: str) -> None:
              global text
              start, end, obj = object_span(key)
              pattern = re.compile(rf'("{re.escape(field)}": "){re.escape(old)}(")')
              updated, count = pattern.subn(rf'\g<1>{new}\g<2>', obj, count=1)
              if count != 1:
                  raise SystemExit(f'expected one {key}.{field} {old}->{new}, got {count}')
              text = text[:start] + updated + text[end:]

          def replace_literal(key: str, old: str, new: str) -> None:
              global text
              start, end, obj = object_span(key)
              if obj.count(old) != 1:
                  raise SystemExit(f'expected one literal in {key}: {old!r}; got {obj.count(old)}')
              text = text[:start] + obj.replace(old, new, 1) + text[end:]

          lane_prs = {
              'OUT-104': 468,
              'OUT-105': 469,
              'OUT-106': 470,
              'OUT-107': 471,
              'OUT-108': 472,
              'OUT-109': 473,
          }
          evidence = (
              '[\n'
              '        "pr:474",\n'
              '        "gha:31339325608/jds-effective-plan",\n'
              '        "main:fe0c3560d0b82e49a8606f7737438863d3ea4809"\n'
              '      ]'
          )
          for key, pr in lane_prs.items():
              replace_field(key, 'state', 'IN_PROGRESS', 'INTEGRATING')
              replace_literal(key, '"prs": []', f'"prs": [{pr}]')
              replace_literal(key, '"evidence": []', f'"evidence": {evidence}')
              replace_field(key, 'implementationState', 'SPECIFIED_ONLY', 'IMPLEMENTED_MOCK_ONLY')

          marker = '    {\n      "key": "REL-026",'
          if text.count(marker) != 1:
              raise SystemExit('REL-026 insertion marker not unique')
          wave_o = base64.b64decode(
              ''
          ).decode('utf-8')
          text = text.replace(marker, wave_o + marker, 1)
          json.loads(text)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/check_execution_index.py --index docs/m365-transition/execution-index.json --previous /tmp/execution-index.previous.json
      - name: Commit transition
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/m365-transition/execution-index.json
          git diff --cached --quiet && exit 1
          git commit -m 'chore(control): mark Wave N integrating and stage Wave O'
          git push origin HEAD:${GITHUB_REF_NAME}
